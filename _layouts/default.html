<!doctype html>
<html class="no-js" lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="robots" content="index,follow">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0d1319" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <script>document.documentElement.classList.replace('no-js', 'js');</script>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="sitemap" type="application/xml" href="{{ '/sitemap.xml' | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_US">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/social-card.png' | absolute_url }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="pg_local_cache: whole-row primary-key caching for ordinary SQL">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
    <meta name="twitter:image" content="{{ '/assets/social-card.png' | absolute_url }}">
    <meta name="twitter:image:alt" content="pg_local_cache: whole-row primary-key caching for ordinary SQL">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
    {% if page.home %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareSourceCode",
      "name": "pg_local_cache",
      "description": {{ site.description | jsonify }},
      "codeRepository": "https://github.com/{{ site.repository }}",
      "programmingLanguage": ["C", "SQL", "Python"],
      "runtimePlatform": ["PostgreSQL 14", "PostgreSQL 15", "PostgreSQL 16", "PostgreSQL 17", "PostgreSQL 18"],
      "operatingSystem": "Linux amd64 (glibc or musl)",
      "downloadUrl": "https://github.com/{{ site.repository }}/releases/latest",
      "license": "https://opensource.org/license/mit"
    }
    </script>
    {% endif %}
  </head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MHQBYKWZ7W"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-MHQBYKWZ7W');
  </script>
  <body class="{% if page.home %}home{% else %}documentation{% endif %}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="pg_local_cache home">pg_local_cache</a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
        <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/#sql-api' | relative_url }}">SQL API</a>
          <a href="{{ '/docs/INSTALL_EXISTING.html' | relative_url }}"{% if page.url == '/docs/INSTALL_EXISTING.html' %} aria-current="page"{% endif %}>Install</a>
          <a href="{{ '/docs/BENCHMARKS.html' | relative_url }}"{% if page.url == '/docs/BENCHMARKS.html' %} aria-current="page"{% endif %}>Benchmarks</a>
          <a href="{{ '/docs/MONITORING.html' | relative_url }}"{% if page.url == '/docs/MONITORING.html' %} aria-current="page"{% endif %}>Monitoring</a>
          <a href="{{ '/docs/TECHNICAL.html' | relative_url }}"{% if page.url == '/docs/TECHNICAL.html' %} aria-current="page"{% endif %}>Technical</a>
          <a class="nav-download" href="https://github.com/{{ site.repository }}/releases/latest">Download</a>
        </nav>
      </div>
    </header>
    {{ content }}
    <footer class="site-footer">
      <div class="footer-inner">
        <a class="wordmark" href="{{ '/' | relative_url }}">pg_local_cache</a>
        <p>PostgreSQL 14–18 · Linux amd64 · MIT</p>
        <a href="https://github.com/{{ site.repository }}">GitHub</a>
      </div>
    </footer>
    <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
  </body>
</html>
