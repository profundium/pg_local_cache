# Local first-success demo only. Always pin --project-name pg_local_cache_demo.
# Trust authentication is safe here only because PostgreSQL has no host port.
name: pg_local_cache_demo

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        POSTGRES_MAJOR: ${POSTGRES_MAJOR:-16}
        POSTGRES_VARIANT: ${POSTGRES_VARIANT:-bookworm}
        PGLC_BUILD_ID: ${PGLC_BUILD_ID:-local-demo}
    image: pg_local_cache:demo
    shm_size: 128mb
    mem_limit: ${PG_LOCAL_CACHE_DEMO_MEMORY_LIMIT:-512m}
    mem_reservation: ${PG_LOCAL_CACHE_DEMO_MEMORY_RESERVATION:-256m}
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      PG_LOCAL_CACHE_DATABASE: app
      PG_LOCAL_CACHE_ROLE: local_cache_worker
      PG_LOCAL_CACHE_BIND_ADDRESS: 127.0.0.1
      PG_LOCAL_CACHE_PORT: "0"
      PG_LOCAL_CACHE_WORKERS: "1"
      PG_LOCAL_CACHE_CACHE_ENTRIES: "4096"
      PG_LOCAL_CACHE_RELATION_STATES: "128"
      PG_LOCAL_CACHE_MAX_CLIENTS: "32"
      PG_LOCAL_CACHE_MAX_CLIENTS_PER_WORKER: "32"
      PG_LOCAL_CACHE_MEMORY_BUDGET_MB: "128"
      PG_LOCAL_CACHE_MAX_WORKER_PROCESSES: "4"
      PG_LOCAL_CACHE_SINGLEFLIGHT_WAIT_MS: "25"
      PG_LOCAL_CACHE_MAX_DIRTY_KEYS: "1024"
    volumes:
      - pg_local_cache_demo_data:/var/lib/postgresql/data
      - type: bind
        source: ./docker/initdb/020_demo.sql
        target: /docker-entrypoint-initdb.d/020_demo.sql
        read_only: true
    healthcheck:
      test: ["CMD", "/usr/local/bin/pg_local_cache_healthcheck"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12

volumes:
  pg_local_cache_demo_data:
