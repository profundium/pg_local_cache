read_diagram:
  title: The RESP MGET read path
  description: The application sends authenticated RESP MGET. An eligible cache hit returns the stored whole-row payload. A miss or bypass reads the source table through the configured worker role and returns the row over RESP.
  application: Application
  checks: Eligibility + snapshot
  hit: Hit
  miss: Miss / bypass
  stored: Stored
  row: row
  source: Source
  table: table
  caption: Both paths return whole rows over RESP. A source-table read can fill the cache.
transaction_diagram:
  title: What readers see during an update
  description: Under READ COMMITTED, start with revision zero. A transaction updates it to one. The writer sees one through a source-table read, while another session still sees zero. After COMMIT, a new statement in the other session sees one. After ROLLBACK, it still sees zero.
  committed: Committed row
  open: Transaction open
  writer: Writer reads 1
  other: Other session reads 0
  next: Next read
  caption: READ COMMITTED, starting from revision 0. “Next read” means a new statement in the other session after COMMIT or ROLLBACK. The writer reads its own change through the source table.
