read_diagram:
  title: Путь чтения RESP MGET
  description: Приложение отправляет аутентифицированную команду RESP MGET. Допустимое попадание возвращает сохранённую полную строку. При промахе или обходе исходная таблица читается с настроенной ролью worker, а строка возвращается через RESP.
  application: "Приложение"
  checks: "Допустимость + снимок"
  hit: "Попадание"
  miss: "Промах / обход"
  stored: "Сохранённая"
  row: "строка"
  source: "Исходная"
  table: "таблица"
  caption: Оба пути возвращают полные строки через RESP. Чтение исходной таблицы может заполнить кэш.
transaction_diagram:
  title: "Что видят читатели во время обновления"
  description: "В режиме READ COMMITTED начнём с ревизии ноль. Транзакция обновляет её до единицы. Записывающий сеанс видит единицу через чтение исходной таблицы, а другой сеанс по-прежнему видит ноль. После COMMIT новый оператор в другом сеансе видит единицу. После ROLLBACK он по-прежнему видит ноль."
  committed: "Зафиксированная строка"
  open: "Транзакция открыта"
  writer: "Записывающий сеанс читает 1"
  other: "Другой сеанс читает 0"
  next: "Новое чтение"
  caption: "READ COMMITTED, начальная ревизия 0. «Новое чтение» означает новый оператор в другом сеансе после COMMIT или ROLLBACK. Записывающий сеанс читает собственное изменение через исходную таблицу."
