read_diagram:
  title: Lesepfad von SQL mget
  description: Die Anwendung ruft local_cache.mget in PostgreSQL auf. Nach Eignungs- und Snapshot-Prüfungen gibt ein Cache-Treffer die gespeicherte vollständige Zeile zurück. Ein Fehltreffer oder Bypass liest die Quelltabelle. Beide Pfade geben Zeilen über dieselbe PostgreSQL-Verbindung zurück.
  application: Anwendung
  checks: Eignung + Snapshot
  hit: Treffer
  miss: Kein Treffer
  stored: Gespeichert
  row: Zeile
  source: Quelle
  table: Tabelle
  caption: Beide Pfade geben serialisierte vollständige Zeilen über dieselbe PostgreSQL-Verbindung zurück. Ein geeigneter Lesevorgang aus der Quelltabelle kann den Cache füllen.
transaction_diagram:
  title: Was Leser während einer Änderung sehen
  description: Unter READ COMMITTED starten wir mit Revision null. Eine Transaktion ändert sie auf eins. Der Schreiber sieht eins über einen Lesevorgang aus der Quelltabelle, während eine andere Sitzung weiterhin null sieht. Nach COMMIT sieht eine neue Anweisung in der anderen Sitzung eins. Nach ROLLBACK sieht sie weiterhin null.
  committed: Bestätigte Zeile
  open: Transaktion offen
  writer: Schreiber liest 1
  other: Andere Sitzung liest 0
  next: Nächste Abfrage
  caption: READ COMMITTED, beginnend mit Revision 0. „Nächster Lesevorgang“ bedeutet eine neue Anweisung in der anderen Sitzung nach COMMIT oder ROLLBACK. Der Schreiber liest seine eigene Änderung über die Quelltabelle.
