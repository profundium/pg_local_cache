read_diagram:
  title: SQL mget 读取路径
  description: 应用在 PostgreSQL 内调用 local_cache.mget。经过适用性与快照检查后，缓存命中返回已存整行载荷。未命中或绕过缓存时读取源表。两条路径均通过同一 PostgreSQL 连接返回行。
  application: 应用
  checks: 适用性与快照
  hit: 命中
  miss: 未命中 / 绕过
  stored: 已缓存
  row: 行
  source: 源
  table: 表
  caption: 两条路径均通过同一 PostgreSQL 连接返回序列化整行。符合条件的源表读取可以填充缓存。
transaction_diagram:
  title: 更新过程中读者看到什么
  description: 在 READ COMMITTED 下，从 revision 0 开始。一个事务将其更新为 1。写者通过源表读取看到 1，另一个会话仍看到 0。COMMIT 后，另一个会话的新语句看到 1；ROLLBACK 后，它仍看到 0。
  committed: 已提交行
  open: 事务尚未结束
  writer: 写者读取 1
  other: 另一个会话读取 0
  next: 下一次读取
  caption: READ COMMITTED，从 revision 0 开始。“下一次读取”指另一个会话在 COMMIT 或 ROLLBACK 之后执行的新语句。写者通过源表读取自己的改动。
