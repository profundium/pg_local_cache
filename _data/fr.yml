read_diagram:
  title: Chemin de lecture SQL mget
  description: L'application appelle local_cache.mget dans PostgreSQL. Après les vérifications d'éligibilité et de snapshot, un hit du cache renvoie la charge utile stockée de la ligne complète. Un miss ou un contournement lit la table source. Les deux chemins renvoient les lignes via la même connexion PostgreSQL.
  application: Application
  checks: Éligibilité + snapshot
  hit: Trouvé
  miss: Absent / ignoré
  stored: Stockée
  row: ligne
  source: Source
  table: table
  caption: Les deux chemins renvoient des lignes complètes sérialisées via la même connexion PostgreSQL. Une lecture éligible de la table source peut remplir le cache.
transaction_diagram:
  title: Ce que voient les lecteurs pendant une mise à jour
  description: Sous READ COMMITTED, commencez avec la révision zéro. Une transaction la met à jour à un. L'écrivain voit un par une lecture de la table source, tandis qu'une autre session voit encore zéro. Après COMMIT, une nouvelle instruction de l'autre session voit un. Après ROLLBACK, elle voit toujours zéro.
  committed: Ligne validée
  open: Transaction ouverte
  writer: L'écrivain lit 1
  other: L'autre session lit 0
  next: Lecture suivante
  caption: READ COMMITTED, à partir de la révision 0. « Lecture suivante » désigne une nouvelle instruction dans l'autre session après COMMIT ou ROLLBACK. L'écrivain lit sa propre modification via la table source.
