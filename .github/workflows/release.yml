name: Release pg_local_cache

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag, version, and commit identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/tags/* ]] || {
            echo "::error::Run releases from a version tag"
            exit 1
          }
          version="$(sed -n "s/^default_version = '\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)'$/\1/p" pg_local_cache.control)"
          [[ -n "$version" && "$GITHUB_REF_NAME" == "v${version}" ]] || {
            echo "::error::Tag ${GITHUB_REF_NAME} must match v<default_version> (v${version})"
            exit 1
          }
          scripts/bump-version.sh --check
          sha="$(git rev-parse HEAD)"
          [[ "$sha" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" == "$sha" ]]

  ci:
    uses: ./.github/workflows/ci.yml

  packages:
    uses: ./.github/workflows/packages.yml

  source:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build and test source archive
        shell: bash
        run: |
          set -Eeuo pipefail
          V="$(sed -n "s/^default_version = '\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)'$/\1/p" pg_local_cache.control)"
          SHA="$GITHUB_SHA"
          [[ -n "$V" && "$(git rev-parse HEAD)" == "$SHA" ]]
          mkdir -p dist "$RUNNER_TEMP/source-extract"
          git archive --format=tar --prefix="pg_local_cache-$V/" "$SHA" \
            | gzip -n >"dist/pg_local_cache-$V.tar.gz"
          tar -xzf "dist/pg_local_cache-$V.tar.gz" -C "$RUNNER_TEMP/source-extract"
          (
            cd "$RUNNER_TEMP/source-extract/pg_local_cache-$V"
            make source-test
          )

      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source
          path: dist/pg_local_cache-*.tar.gz
          if-no-files-found: error

  publish:
    needs: [verify, ci, packages, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      attestations: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release notes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download all release artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums and extract changelog notes
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(sed -n "s/^default_version = '\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)'$/\1/p" pg_local_cache.control)"
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          awk -v version="$version" \
            'index($0, "## [" version "]") == 1 { found=1; next }
             found && index($0, "## [") == 1 { exit }
             found { print }
             END { if (!found) exit 1 }' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          [[ -s "$RUNNER_TEMP/release-notes.md" ]] || {
            echo "::error::CHANGELOG.md has no notes for ${version}"
            exit 1
          }

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create GitHub release
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(sed -n "s/^default_version = '\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)'$/\1/p" pg_local_cache.control)"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --target "$GITHUB_SHA" \
            --title "pg_local_cache ${version}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

  pgxn:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: pgxn/pgxn-tools:latest
    steps:
      - name: Check out the published commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check version metadata
        run: scripts/bump-version.sh --check

      - name: Check tag version
        shell: bash
        run: |
          version="$(awk -F"'" '/^default_version = / {print $2}' pg_local_cache.control)"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Build PGXN distribution
        run: pgxn-bundle

      - name: Publish to PGXN
        env:
          PGXN_USERNAME: ${{ secrets.PGXN_USERNAME }}
          PGXN_PASSWORD: ${{ secrets.PGXN_PASSWORD }}
        run: pgxn-release
