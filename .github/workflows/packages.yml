name: Packages

on:
  pull_request:
    paths:
      - "debian/**"
      - "rpm/**"
      - "src/**"
      - "sql/**"
      - "Makefile"
      - "*.control"
      - ".github/workflows/packages.yml"
  workflow_call:

permissions:
  contents: read

jobs:
  deb:
    name: Debian packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    env:
      PG_SUPPORTED_VERSIONS: |
        14
        15
        16
        17
        18
    steps:
      # Without git in the container, checkout falls back to a GitHub archive,
      # which honours export-ignore and drops debian/ and rpm/.
      - name: Install git
        run: |
          for i in 1 2 3 4 5; do apt-get update -qq && apt-get install -y -qq git ca-certificates && break; sleep "$i"; done
          git --version
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Debian packages and run installcheck
        shell: bash
        run: |
          set -Eeuo pipefail
          retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then return 0; fi
              echo "attempt $attempt/5 failed: $*" >&2
              sleep "$attempt"
            done
            return 1
          }

          export DEBIAN_FRONTEND=noninteractive
          retry apt-get update
          retry apt-get install -y --no-install-recommends ca-certificates curl gnupg postgresql-common
          retry /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          retry apt-get update
          retry apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper fakeroot postgresql-server-dev-all \
            postgresql-server-dev-14 postgresql-server-dev-15 \
            postgresql-server-dev-16 postgresql-server-dev-17 \
            postgresql-server-dev-18

          test "$(pg_buildext supported-versions | LC_ALL=C sort -V | xargs)" = "14 15 16 17 18"
          pg_buildext updatecontrol
          dpkg-buildpackage -b -us -uc

          shopt -s nullglob
          packages=(../postgresql-*-pg-local-cache_*_*.deb)
          test "${#packages[@]}" -eq 5
          retry apt-get install -y "${packages[@]}" \
            postgresql-14 postgresql-15 postgresql-16 postgresql-17 postgresql-18
          debian/tests/installcheck

          mkdir -p package-artifacts/deb
          cp "${packages[@]}" package-artifacts/deb/

      - name: Upload Debian packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb-${{ matrix.arch }}
          path: package-artifacts/deb/*.deb
          if-no-files-found: error

  rpm:
    name: RPM PostgreSQL ${{ matrix.pgmajor }} (${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    # The Docker Hub "rockylinux" image stopped at 9.3; PGDG only serves 9.6+.
    container: rockylinux/rockylinux:9
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pgmajor: [14, 15, 16, 17, 18]
        target:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    env:
      PGMAJOR: ${{ matrix.pgmajor }}
      RPM_ARCH: ${{ matrix.target.arch }}
    steps:
      - name: Install git
        run: |
          for i in 1 2 3 4 5; do dnf -y install git && break; sleep "$i"; done
          git --version
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build, install, and test PGDG RPM
        shell: bash
        run: |
          set -Eeuo pipefail
          retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then return 0; fi
              echo "attempt $attempt/5 failed: $*" >&2
              sleep "$attempt"
            done
            return 1
          }

          repo_url="https://download.postgresql.org/pub/repos/yum/reporpms/EL-9-${RPM_ARCH}/pgdg-redhat-repo-latest.noarch.rpm"
          retry dnf -y install "$repo_url"
          repos=(--disablerepo='pgdg*' "--enablerepo=pgdg${PGMAJOR}" --enablerepo=pgdg-common --enablerepo=crb)
          retry dnf "${repos[@]}" -qy module disable postgresql
          retry dnf "${repos[@]}" -y install \
            rpm-build "postgresql${PGMAJOR}-devel" clang llvm gzip

          version="$(sed -n "s/^default_version = '\([^']*\)'$/\1/p" pg_local_cache.control)"
          [[ -n "$version" ]] || { echo "could not read default_version" >&2; exit 1; }

          buildroot="$HOME/rpmbuild"
          mkdir -p "$buildroot/SOURCES" "$buildroot/SPECS"
          cp rpm/pg_local_cache.spec "$buildroot/SPECS/"
          # checkout only trusts the workspace for its own step.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --format=tar --prefix="pg_local_cache-$version/" HEAD \
            | gzip -n >"$buildroot/SOURCES/pg_local_cache-$version.tar.gz"
          rpmbuild -bb --define "pgmajorversion ${PGMAJOR}" \
            "$buildroot/SPECS/pg_local_cache.spec"

          rpm_dir="$buildroot/RPMS/$RPM_ARCH"
          mapfile -t built_rpms < <(find "$rpm_dir" -maxdepth 1 -type f -name '*.rpm' -print | LC_ALL=C sort)
          main_rpm=""
          for package in "${built_rpms[@]}"; do
            if [[ "$(basename "$package")" == "pg_local_cache_${PGMAJOR}-${version}-"*.rpm ]]; then
              main_rpm="$package"
              break
            fi
          done
          [[ -n "$main_rpm" && "${#built_rpms[@]}" -ge 1 ]]
          retry dnf "${repos[@]}" -y install "$main_rpm" "postgresql${PGMAJOR}-server"

          pgdata="/var/lib/pgsql/${PGMAJOR}/data"
          install -d -o postgres -g postgres "$pgdata"
          runuser -u postgres -- "/usr/pgsql-${PGMAJOR}/bin/initdb" -D "$pgdata"
          cat >>"$pgdata/postgresql.conf" <<'EOF'
          shared_preload_libraries = 'pg_local_cache'
          pg_local_cache.port = 0
          pg_local_cache.database = 'contrib_regression'
          pg_local_cache.role = 'regress_pglc_worker'
          EOF
          chown postgres:postgres "$pgdata/postgresql.conf"
          runuser -u postgres -- "/usr/pgsql-${PGMAJOR}/bin/pg_ctl" \
            -D "$pgdata" -l "$pgdata/logfile" start -w
          chown -R postgres:postgres "$GITHUB_WORKSPACE"
          runuser -u postgres -- make installcheck \
            PG_CONFIG="/usr/pgsql-${PGMAJOR}/bin/pg_config"

          mkdir -p package-artifacts/rpm
          cp "${built_rpms[@]}" package-artifacts/rpm/

      - name: Upload RPM packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpm-${{ matrix.pgmajor }}-${{ matrix.target.arch }}
          path: package-artifacts/rpm/*.rpm
          if-no-files-found: error
