name: PGXN package

on:
  pull_request:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    container:
      image: pgxn/pgxn-tools:latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check version metadata
        run: scripts/bump-version.sh --check

      - name: Build PGXN distribution
        run: pgxn-bundle

      - name: Upload PGXN ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pgxn-bundle
          path: pg_local_cache-*.zip
          if-no-files-found: error
          retention-days: 14
