name: CI

on:
  push:
    branches: ["master"]
    paths-ignore:
      - "docs/**"
      - "examples/**"
      - "site/**"
      - "README.md"
      - "PRODUCT.md"
      - "CONTRIBUTING.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/examples.yml"
      - "scripts/check_site.py"
      - "scripts/benchmark_report.py"
      - "tests/pages_contract_test.py"
      - "tests/browser/**"
      - "tests/*docs_smoke.py"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "examples/**"
      - "site/**"
      - "README.md"
      - "PRODUCT.md"
      - "CONTRIBUTING.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/examples.yml"
      - "scripts/check_site.py"
      - "scripts/benchmark_report.py"
      - "tests/pages_contract_test.py"
      - "tests/browser/**"
      - "tests/*docs_smoke.py"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pg_local_cache_ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-unit:
    name: source-unit (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install PostgreSQL server headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ca-certificates curl gnupg postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-server-dev-17

      - name: Validate and test source
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: make verify-static source-test source-sanitize

  docker-integration:
    name: docker-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and integrate
        env:
          PG_LOCAL_CACHE_SMOKE_DATABASE: pg_local_cache_ci
          PG_LOCAL_CACHE_SMOKE_ROLE: local_cache_ci_worker
          PG_LOCAL_CACHE_SMOKE_CACHE_ENTRIES: "128"
          PG_LOCAL_CACHE_SMOKE_MAX_PREPARED_TRANSACTIONS: "10"
          PG_LOCAL_CACHE_SMOKE_REQUIRE_SMALL_CACHE: "1"
          PG_LOCAL_CACHE_SMOKE_REQUIRE_2PC: "1"
          PG_LOCAL_CACHE_SMOKE_DURATION: "1"
          PG_LOCAL_CACHE_SMOKE_MIN_OPS: "0"
          PG_LOCAL_CACHE_SMOKE_CONCURRENCY: "4"
          PG_LOCAL_CACHE_SMOKE_PIPELINE: "8"
          PG_LOCAL_CACHE_SMOKE_KEYS: "128"
        run: bash tests/docker_smoke.sh

  test:
    name: PostgreSQL ${{ matrix.postgres }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: [14, 15, 16, 17, 18]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Run regression, RESP, and upgrade tests
        run: sudo test/ci.sh ${{ matrix.postgres }}
