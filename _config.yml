title: pg_local_cache
description: Transaction-aware PostgreSQL row cache with SQL mget and optional RESP2.
url: https://profundium.github.io
baseurl: /pg_local_cache
repository: profundium/pg_local_cache
lang: en
markdown: kramdown
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: pretty
exclude:
  - README.md
  - docker
  - scripts
  - sql
  - src
  - test
  - tests
  - Dockerfile
  - Makefile
  - compose.yaml
  - pg_local_cache.control
  - vendor
