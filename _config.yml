title: pg_local_cache
description: Transaction-aware PostgreSQL row cache with SQL mget and optional RESP2.
url: https://profundium.github.io
baseurl: /pg_local_cache
repository: profundium/pg_local_cache
lang: en
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: pretty
exclude:
