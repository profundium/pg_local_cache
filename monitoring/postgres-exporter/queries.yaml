pg_local_cache:
  query: |
    SELECT metrics.*
      FROM local_cache.metrics() AS metrics
  master: true
  metrics:
    - up:
        usage: GAUGE
        description: Whether pg_local_cache shared state and metrics are available (1 is ready).
    - cache_capacity:
        usage: GAUGE
        description: Maximum number of cache entries.
    - entries:
        usage: GAUGE
        description: Current number of cache entries.
    - relation_states:
        usage: GAUGE
        description: Current number of relation invalidation state entries.
    - relation_state_capacity:
        usage: GAUGE
        description: Maximum number of relation invalidation state entries.
    - global_dirty_writers:
        usage: GAUGE
        description: Transactions currently holding a global invalidation fence.
    - active_clients:
        usage: GAUGE
        description: Current RESP client connections across all workers.
    - peak_active_clients:
        usage: GAUGE
        description: Peak RESP client connections since PostgreSQL startup.
    - max_clients:
        usage: GAUGE
        description: Global RESP client connection limit.
    - client_slots:
        usage: GAUGE
        description: Number of preallocated RESP client slots across all workers.
    - workers_configured:
        usage: GAUGE
        description: Configured number of RESP workers.
    - workers_running:
        usage: GAUGE
        description: RESP workers currently running.
    - workers_with_incomplete_mappings:
        usage: GAUGE
        description: RESP workers that have not loaded the current complete mapping generation.
    - shared_memory_bytes:
        usage: GAUGE
        description: Bytes reserved in PostgreSQL shared memory for pg_local_cache.
    - worker_memory_bytes:
        usage: GAUGE
        description: Estimated bytes reserved by all pg_local_cache RESP workers.
    - estimated_memory_bytes:
        usage: GAUGE
        description: Total deterministic pg_local_cache memory estimate in bytes.
    - memory_budget_bytes:
        usage: GAUGE
        description: Configured pg_local_cache startup memory budget in bytes.
    - cache_hits_total:
        usage: COUNTER
        description: Cache hits since PostgreSQL startup.
    - cache_misses_total:
        usage: COUNTER
        description: Cache misses since PostgreSQL startup.
    - negative_hits_total:
        usage: COUNTER
        description: Negative-cache hits since PostgreSQL startup.
    - sql_cache_hits_total:
        usage: COUNTER
        description: SQL mget cache hits since PostgreSQL startup.
    - sql_cache_misses_total:
        usage: COUNTER
        description: SQL mget cache misses since PostgreSQL startup.
    - sql_cache_fills_total:
        usage: COUNTER
        description: SQL mget cache fills since PostgreSQL startup.
    - sql_cache_bypasses_total:
        usage: COUNTER
        description: SQL mget bypasses since PostgreSQL startup.
    - database_reads_total:
        usage: COUNTER
        description: Database reads performed by cache workers since PostgreSQL startup.
    - database_writes_total:
        usage: COUNTER
        description: Database writes performed by cache workers since PostgreSQL startup.
    - invalidations_total:
        usage: COUNTER
        description: Transactionally published invalidations since PostgreSQL startup.
    - evictions_total:
        usage: COUNTER
        description: Cache evictions since PostgreSQL startup.
    - singleflight_leaders_total:
        usage: COUNTER
        description: Singleflight leaders elected since PostgreSQL startup.
    - singleflight_waiters_total:
        usage: COUNTER
        description: Singleflight waiters since PostgreSQL startup.
    - singleflight_reuses_total:
        usage: COUNTER
        description: Singleflight results reused since PostgreSQL startup.
    - singleflight_timeouts_total:
        usage: COUNTER
        description: Singleflight waits that timed out since PostgreSQL startup.
    - rejected_connections_total:
        usage: COUNTER
        description: RESP connections rejected since PostgreSQL startup.
    - client_limit_rejections_total:
        usage: COUNTER
        description: RESP connections rejected by the global client limit since PostgreSQL startup.
    - authentication_failures_total:
        usage: COUNTER
        description: RESP authentication failures since PostgreSQL startup.
    - protocol_errors_total:
        usage: COUNTER
        description: Invalid RESP protocol requests since PostgreSQL startup.
    - output_backpressure_events_total:
        usage: COUNTER
        description: RESP output backpressure events since PostgreSQL startup.
    - slow_client_drops_total:
        usage: COUNTER
        description: Slow RESP clients disconnected since PostgreSQL startup.
    - worker_starts_total:
        usage: COUNTER
        description: RESP worker starts since PostgreSQL startup.
    - dirty_key_limit_fallbacks_total:
        usage: COUNTER
        description: Transactions that fell back to relation invalidation after reaching the dirty-key limit.
    - mapping_reload_failures_total:
        usage: COUNTER
        description: Cache mapping reload failures since PostgreSQL startup.
    - mapping_reload_incomplete_retries_total:
        usage: COUNTER
        description: Mapping reloads that omitted one or more unsafe mappings since PostgreSQL startup.
