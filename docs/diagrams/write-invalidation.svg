<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Write invalidation and transaction fences</title>
<desc id="desc">A writer updates a mapped row. Its trigger marks the key dirty. The pre-commit callback publishes an invalidation fence before commit becomes visible; a later reader sees the committed version. A rollback before pre-commit leaves the old cache entry valid.</desc>
<style>
:root{color-scheme:light dark;--bg:#f8fafc;--panel:#fff;--ink:#17212b;--muted:#526170;--line:#526b80;--blue:#dceefe;--green:#e2f4e8;--amber:#fff0cf;--stroke:#52738e}
*{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.bg{fill:var(--bg)}.box{fill:var(--panel);stroke:var(--stroke);stroke-width:2.5;rx:16}.writer{fill:var(--blue)}.trigger{fill:var(--amber)}.cache{fill:var(--green)}
.head{fill:var(--ink);font-size:20px;font-weight:700;text-anchor:middle}.body{fill:var(--muted);font-size:17px;text-anchor:middle}.label{fill:var(--ink);font-size:17px;font-weight:600;text-anchor:middle}
.arrow{fill:none;stroke:var(--line);stroke-width:3;marker-end:url(#arrow)}
@media(prefers-color-scheme:dark){:root{--bg:#101820;--panel:#17232d;--ink:#eef4f8;--muted:#c0ccd5;--line:#90a9bc;--blue:#18384e;--green:#1c4034;--amber:#4a3820;--stroke:#7899b1}}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--line)"/></marker></defs>
<rect class="bg" width="1200" height="540"/>
<text class="head" x="600" y="48">Write invalidation sequence</text>
<rect class="box writer" x="35" y="112" width="240" height="112"/><text class="head" x="155" y="155">1. Writer UPDATE</text><text class="body" x="155" y="189">ordinary SQL session</text>
<rect class="box trigger" x="330" y="112" width="240" height="112"/><text class="head" x="450" y="155">2. Trigger marks</text><text class="body" x="450" y="189">key dirty in transaction</text>
<rect class="box cache" x="625" y="112" width="240" height="112"/><text class="head" x="745" y="155">3. Pre-commit fence</text><text class="body" x="745" y="189">old entry invalidated</text>
<rect class="box writer" x="920" y="112" width="240" height="112"/><text class="head" x="1040" y="155">4. COMMIT</text><text class="body" x="1040" y="189">Later MGET: new row</text>
<path class="arrow" d="M275 168H322"/><path class="arrow" d="M570 168H617"/><path class="arrow" d="M865 168H912"/>
<rect class="box writer" x="210" y="330" width="280" height="94"/><text class="head" x="350" y="370">ROLLBACK before</text><text class="body" x="350" y="400">pre-commit callback</text>
<rect class="box cache" x="650" y="330" width="300" height="94"/><text class="head" x="800" y="370">Prior entry stays valid</text><text class="body" x="800" y="400">no fence is published</text>
<path class="arrow" d="M490 377H642"/><text class="body" x="600" y="490">Fence publishes before the write becomes visible.</text>
</svg>
